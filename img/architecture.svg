<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .grp { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .big { fill: #1d4ed8; }
      .t1 { font-size: 19px; font-weight: bold; fill: #0f172a; }
      .t2 { font-size: 15px; fill: #334155; }
      .tw { font-size: 22px; font-weight: bold; fill: #ffffff; }
      .lbl { font-size: 14px; fill: #1d4ed8; font-weight: bold; }
    </style>
  </defs>

  <rect x="0" y="0" width="1100" height="770" fill="#f8fafc"/>
  <text x="550" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">How openwrt-view works</text>

  <!-- ==================== LAYER 1: WHERE DATA COMES FROM ==================== -->
  <text x="550" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">1 · WHAT IT WATCHES (all on your network)</text>

  <rect x="40" y="106" width="330" height="150" class="box" rx="10"/>
  <text x="205" y="136" text-anchor="middle" class="t1">Router services</text>
  <text x="205" y="162" text-anchor="middle" class="t2">SQM/CAKE queue stats (tc)</text>
  <text x="205" y="186" text-anchor="middle" class="t2">Per-client traffic (nlbwmon)</text>
  <text x="205" y="210" text-anchor="middle" class="t2">Who is online (neighbour table)</text>
  <text x="205" y="234" text-anchor="middle" class="t2">Device names (DHCP leases)</text>

  <rect x="385" y="106" width="330" height="150" class="box" rx="10"/>
  <text x="550" y="136" text-anchor="middle" class="t1">Orbi mesh (optional)</text>
  <text x="550" y="162" text-anchor="middle" class="t2">Which device is on which node</text>
  <text x="550" y="186" text-anchor="middle" class="t2">Wi-Fi band and signal</text>
  <text x="550" y="210" text-anchor="middle" class="t2">Join / leave / roam events</text>
  <text x="550" y="234" text-anchor="middle" class="t2">Satellite backhaul quality</text>

  <rect x="730" y="106" width="330" height="150" class="box" rx="10"/>
  <text x="895" y="136" text-anchor="middle" class="t1">Tapo plug (optional)</text>
  <text x="895" y="162" text-anchor="middle" class="t2">Live power draw</text>
  <text x="895" y="186" text-anchor="middle" class="t2">Wall input voltage</text>
  <text x="895" y="210" text-anchor="middle" class="t2">Energy totals</text>

  <!-- arrows down -->
  <text x="550" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">2 · WHAT IT DOES  (one program, nothing else to install)</text>
  <line x1="205" y1="256" x2="205" y2="322" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ==================== LAYER 2: THE BINARY ==================== -->
  <rect x="150" y="330" width="800" height="180" class="grp big" rx="14"/>
  <text x="550" y="370" text-anchor="middle" class="tw">openwrt-view  —  one program on the router, port 11112</text>
  <text x="550" y="410" text-anchor="middle" font-size="16" fill="#ffffff">Collects the numbers above · gives every device a friendly name ·</text>
  <text x="550" y="436" text-anchor="middle" font-size="16" fill="#ffffff">grades line health (A+ to F) · sends alerts when something degrades ·</text>
  <text x="550" y="462" text-anchor="middle" font-size="16" fill="#ffffff">serves the whole dashboard itself — nothing else to install</text>
  <text x="550" y="492" text-anchor="middle" font-size="13" fill="#bfdbfe">read-only: it observes your network, it never changes anything</text>

  <!-- arrow down -->
  <line x1="550" y1="510" x2="550" y2="546" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arr)"/>
  <text x="565" y="534" class="lbl">publishes</text>
  <text x="550" y="575" text-anchor="middle" font-size="15" font-weight="bold" fill="#64748b">3 · WHAT YOU GET</text>

  <!-- ==================== LAYER 3: WHAT YOU GET ==================== -->
  <g>
    <rect x="40" y="590" width="500" height="70" class="box" rx="10"/>
    <text x="70" y="620" class="t1">Browser dashboard</text>
    <text x="70" y="644" class="t2">open http://&lt;router-ip&gt;:11112 from any device</text>
  </g>
  <g>
    <rect x="560" y="590" width="500" height="70" class="box" rx="10"/>
    <text x="590" y="620" class="t1">Alerts on your phone</text>
    <text x="590" y="644" class="t2">push via ntfy when quality degrades (optional)</text>
  </g>
  <g>
    <rect x="40" y="676" width="500" height="70" class="box" rx="10" stroke-dasharray="6 4"/>
    <text x="70" y="706" class="t1">Daily usage files</text>
    <text x="70" y="730" class="t2">per-device totals under /opt/monitoring</text>
  </g>
  <g>
    <rect x="560" y="676" width="500" height="70" class="box" rx="10" stroke-dasharray="6 4"/>
    <text x="590" y="706" class="t1">Long-term graphs</text>
    <text x="590" y="730" class="t2">optional VictoriaMetrics backend</text>
  </g>
</svg>
